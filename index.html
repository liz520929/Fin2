<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffd8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Money Land" />
  <title>MONEY LAND 理財樂園</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MONEY LAND</p>
        <h1>理財樂園</h1>
      </div>
      <button class="icon-btn" id="resetBtn" aria-label="重設資料">↻</button>
    </header>

    <main>
      <section class="hero card">
        <div class="hero-copy">
          <span class="weather">☀️ 本月樂園營運中</span>
          <h2>把每一筆錢，<br>變成夢想的門票。</h2>
          <p id="heroMessage">Luna 正在幫你顧好今天的預算 🐶</p>
        </div>
        <div class="castle" aria-hidden="true">🏰</div>
      </section>

      <section class="summary-grid">
        <article class="mini-card">
          <span>本月收入</span>
          <strong id="incomeText">NT$0</strong>
        </article>
        <article class="mini-card">
          <span>已使用</span>
          <strong id="spentText">NT$0</strong>
        </article>
        <article class="mini-card accent">
          <span>還可以使用</span>
          <strong id="remainingText">NT$0</strong>
        </article>
      </section>

      <section class="card progress-card">
        <div class="section-title">
          <div>
            <span class="tag">🎡 預算摩天輪</span>
            <h3>本月預算進度</h3>
          </div>
          <strong id="budgetPercent">0%</strong>
        </div>
        <div class="progress-track">
          <div id="budgetBar" class="progress-bar"></div>
        </div>
        <div class="progress-note">
          <span id="budgetNote">先設定收入，就能開始營運樂園。</span>
          <button class="text-btn" data-view="budget">調整預算</button>
        </div>
      </section>

      <section class="park-grid">
        <button class="park-tile pink" data-view="add">
          <span class="ride">🎠</span>
          <b>每日記帳</b>
          <small>新增一筆消費</small>
        </button>
        <button class="park-tile blue" data-view="budget">
          <span class="ride">🎡</span>
          <b>預算摩天輪</b>
          <small>收入與生活費</small>
        </button>
        <button class="park-tile purple" data-view="debts">
          <span class="ride">🎢</span>
          <b>債務雲霄飛車</b>
          <small>追蹤貸款與卡費</small>
        </button>
        <button class="park-tile yellow" data-view="annual">
          <span class="ride">🎟️</span>
          <b>年度預備券</b>
          <small>保險、稅金、保養</small>
        </button>
      </section>

      <section class="card">
        <div class="section-title">
          <div>
            <span class="tag">🐶 Luna 管理員</span>
            <h3>最近記帳</h3>
          </div>
          <button class="text-btn" data-view="records">查看全部</button>
        </div>
        <div id="recentList" class="record-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-view="home"><span>🏰</span>首頁</button>
      <button data-view="records"><span>🧾</span>明細</button>
      <button class="add-main" data-view="add"><span>＋</span></button>
      <button data-view="budget"><span>🎡</span>預算</button>
      <button data-view="settings"><span>⚙️</span>設定</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-head">
        <div>
          <p class="eyebrow" id="modalEyebrow">MONEY LAND</p>
          <h2 id="modalTitle">新增記帳</h2>
        </div>
        <button id="closeModal" class="icon-btn" aria-label="關閉">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <template id="addTemplate">
    <form id="transactionForm" class="form-stack">
      <label>金額
        <div class="money-input"><span>NT$</span><input name="amount" type="number" min="1" required inputmode="decimal" placeholder="0"></div>
      </label>
      <label>分類
        <select name="category" required>
          <option>吃飯／飲料</option><option>交通</option><option>Luna</option>
          <option>日用品</option><option>娛樂／購物</option><option>醫療／保健</option>
          <option>固定支出</option><option>其他</option>
        </select>
      </label>
      <label>項目<input name="item" required placeholder="例如：午餐、停車費"></label>
      <div class="two-col">
        <label>日期<input name="date" type="date" required></label>
        <label>付款方式
          <select name="payment"><option>信用卡</option><option>現金</option><option>轉帳</option><option>行動支付</option></select>
        </label>
      </div>
      <label>備註<input name="note" placeholder="可不填"></label>
      <button class="primary-btn" type="submit">完成記帳 🎟️</button>
    </form>
  </template>

  <script src="./app.js"></script>
</body>
</html>
