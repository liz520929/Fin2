<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#86d7ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money Land" />
  <title>MONEY LAND 遊樂園</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="game">
    <header class="hud">
      <div class="player">
        <div class="avatar">🐶</div>
        <div>
          <b>Luna 園長</b>
          <span>Level <strong id="level">1</strong></span>
        </div>
      </div>
      <div class="hud-counters">
        <div class="counter coin">🪙 <span id="coinCount">0</span></div>
        <div class="counter ticket">🎟️ <span id="ticketCount">0</span></div>
      </div>
    </header>

    <main class="world">
      <div class="sky">
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="cloud c3">☁️</div>
      </div>

      <section class="park-map" id="parkMap">
        <div class="mountains">⛰️　⛰️　⛰️</div>
        <div class="river"></div>

        <button class="attraction castle-zone" data-view="summary">
          <span class="building">🏰</span>
          <span class="label">財富城堡</span>
          <span class="sub">總覽</span>
        </button>

        <button class="attraction wheel-zone" data-view="budget">
          <span class="building wheel">🎡</span>
          <span class="label">預算摩天輪</span>
          <span class="sub">規劃每月預算</span>
        </button>

        <button class="attraction coaster-zone" data-view="debts">
          <span class="building coaster">🎢</span>
          <span class="label">債務雲霄飛車</span>
          <span class="sub">追蹤貸款卡費</span>
        </button>

        <button class="attraction carousel-zone" data-view="add">
          <span class="building carousel">🎠</span>
          <span class="label">記帳旋轉木馬</span>
          <span class="sub">新增一筆支出</span>
        </button>

        <button class="attraction shop-zone" data-view="records">
          <span class="building">🏪</span>
          <span class="label">消費商店街</span>
          <span class="sub">查看明細</span>
        </button>

        <button class="attraction pet-zone" data-view="luna">
          <span class="building">🐾</span>
          <span class="label">Luna 寵物島</span>
          <span class="sub">狗狗支出</span>
        </button>

        <button class="attraction annual-zone" data-view="annual">
          <span class="building">🎟️</span>
          <span class="label">年度預備站</span>
          <span class="sub">保險與稅金</span>
        </button>

        <div class="path p1"></div><div class="path p2"></div><div class="path p3"></div>
        <div class="trees t1">🌳🌲🌳</div><div class="trees t2">🌲🌳</div><div class="trees t3">🌳🌳🌲</div>

        <div class="luna-guide" id="lunaGuide">
          <div class="bubble" id="guideText">歡迎回來！今天要先去哪個設施？</div>
          <div class="dog">🐶</div>
        </div>
      </section>
    </main>

    <section class="quest-panel">
      <div class="quest-head">
        <div>
          <small>今日任務</small>
          <b id="questTitle">完成第一筆記帳</b>
        </div>
        <span id="questReward">+20 🪙</span>
      </div>
      <div class="quest-progress"><i id="questBar"></i></div>
    </section>

    <nav class="dock">
      <button data-view="summary">🏰<span>城堡</span></button>
      <button data-view="records">🧾<span>明細</span></button>
      <button class="big-add" data-view="add">＋</button>
      <button data-view="budget">🎡<span>預算</span></button>
      <button data-view="settings">⚙️<span>設定</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="panel">
      <div class="panel-head">
        <div>
          <small id="panelEyebrow">MONEY LAND</small>
          <h2 id="panelTitle">標題</h2>
        </div>
        <button id="closeModal">✕</button>
      </div>
      <div id="panelBody"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
